    <div class="contact-card">
      <h1>Contact</h1>
      <p>For general inquiries, email <a href="mailto:president@lodge804.com">president@lodge804.com</a> or use the form below.</p>
      <form id="contact-form" class="contact-form" action="mailto:president@lodge804.com" method="post" enctype="text/plain">
        <label>Name<input id="cf-name" type="text" name="name" required></label>
        <label>Email<input id="cf-email" type="email" name="email" required></label>
        <label>Message<textarea id="cf-message" name="message" rows="6" required></textarea></label>
        <div id="contact-result"></div>
        <button class="btn" type="submit">Send</button>
      </form>
    </div>
